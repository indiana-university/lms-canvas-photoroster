spring:
  application:
    name: photoroster
  config.import: optional:${app.fullFilePath}/${app.overridesFileName}, optional:${app.fullFilePath}/security.properties, classpath:canvas.properties, optional:classpath:git.properties, optional:classpath:denodo.properties, classpath:lti-registrations.properties
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
  datasource:
    url: ${lms.db.url}
    username: ${lms.db.user}
    password: ${lms.db.password}
    type: ${lms.db.poolType}
  cloud.vault.enabled: false
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${oauth.tokenprovider.url}/.well-known/jwks.json
      client:
        registration:
          crimsoncard:
            provider: cc
            client-id: ${crimsoncard.clientId}
            client-secret: ${crimsoncard.secret}
            authorization-grant-type: client_credentials
          lms_canvas_oauth2_photoroster:
            client-id: ${canvas.oauth2.clientId}
            client-secret: ${canvas.oauth2.clientSecret}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: [url:GET|/api/v1/courses/:course_id/users]
        provider:
          cc:
            token-uri: ${crimsoncard.authUrl}
          lms_canvas_oauth2_photoroster:
            authorization-uri: ${canvas.baseUrl}/login/oauth2/auth
            token-uri: ${canvas.baseUrl}/login/oauth2/token
  web.error.whitelabel.enabled: false
# canvas.oauth2.enabled only gates the CanvasRestTemplateAsUser bean. @EnableCanvasOAuth2Client (on
# WebApplication) always needs canvas.oauth2.encryptionPassword/encryptionSalt, which come from
# security.properties like the other secrets (see viewem's application.yml for the full explanation).
canvas:
  oauth2:
    enabled: true
    clientId: ${canvas.oauth2.clientId.photoroster}
    clientSecret: ${canvas.oauth2.clientSecret.photoroster}

photoroster:
  version: @app.version@
  env: ${app.env}
  roleGroupings: TeacherEnrollment,StudentEnrollment,ObserverEnrollment,TaEnrollment,DesignerEnrollment,OtherEnrollment

server:
  servlet:
    session:
      timeout: 30m

app:
  env: dev
  fullFilePath: file:/usr/src/app/config
  overridesFileName: overrides.properties

management:
  endpoint.lms.enabled: true
  endpoints.web.exposure.include: health,lms
  health.redis.enabled: false
  info.java.enabled: true

---

spring:
  config.activate.on-profile: redis-session
  session:
    data:
      redis:
        namespace: photoroster-@app.version@:session
management.health.redis.enabled: true

---

spring:
  config:
    activate.on-profile: vault
    import: vault://
  cloud.vault:
    enabled: true
    config:
      lifecycle.lease-endpoints: leases
    generic:
      enabled: false
    kv:
      enabled: true
      backend: ua-vpit/enterprise-systems/lms/kv
      application-name: photoroster
